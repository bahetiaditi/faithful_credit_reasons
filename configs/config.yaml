# Single source of every tunable value. Code reads this through fcr.config,
# which validates it, so a typo or an impossible value fails at load time
# instead of silently changing a result. Section numbers refer to REFERENCE.md.

project:
  seed: 42

paths:
  # Local working data (gitignored). Holds the 50k-case sample from C7.
  local_data_dir: data
  results_dir: results
  # Where Kaggle mounts the competition (observed Nov 2026); fcr.data.paths falls
  # back to other known layouts if this ever changes.
  kaggle_competition_dir: /kaggle/input/competitions/home-credit-credit-risk-model-stability

data:
  competition_slug: home-credit-credit-risk-model-stability
  file_format: parquet          # the competition ships parquet_files/ and csv_files/
  max_week_num: 91              # WEEK_NUM runs 0..91 in the training base (Section 4)

split:                          # Section 4.5; inclusive week ranges, frozen before modelling
  train_weeks: [0, 63]
  validation_weeks: [64, 77]
  test_weeks: [78, 91]

features:                       # Section 5.1
  max_missing_share: 0.95
  max_abs_spearman: 0.95
  local_sample_cases: 50000
  # Masked values that encode "missing", read as null before encoding. C4:
  # a55475b1 is the most frequent value in 53 of 63 masked columns (median
  # share 82%), which no real category would be.
  masked_missing_values: [a55475b1]
  date_roles_file: configs/date_roles.yaml
  # person_1 holds the applicant (num_group1 == 0) and related persons; the
  # applicant's row is taken as-is, never averaged with relatives'.
  applicant_row_families: [person_1]
  # Per-case statistics for numeric columns of multi-row tables. No "last":
  # the ordering meaning of num_group1 is not documented.
  numeric_stats: [mean, min, max, count]
  # C4: the three tax registries are one source with successive providers
  # (c: Jan-Sep 2019, a: Aug 2019-Apr 2020, b: Apr 2020 on). Mapped onto one
  # schema so features describe the applicant, not which provider was active.
  # C6 screening, all measured on training weeks only so validation and test
  # never influence which features exist.
  max_top_share: 0.995            # near-constant: most frequent non-null value above this share
  max_category_levels: 50         # categories keep their 50 most frequent training levels; the rest -> "__other__"
  corr_sample_cases: 200000       # training cases sampled for the Spearman screen
  # Affordability ratios (Section 5.1 step 7), over aggregated feature names.
  ratios:
    - {name: annuity_to_income__ratio, numerator: annuity_780A, denominator: mainoccupationinc_384A__applicant}
    - {name: credit_to_income__ratio, numerator: credamount_770A, denominator: mainoccupationinc_384A__applicant}
    - {name: debt_to_income__ratio, numerator: totaldebt_9A, denominator: mainoccupationinc_384A__applicant}
    - {name: annuity_to_credit__ratio, numerator: annuity_780A, denominator: credamount_770A}
  tax_registries:
    tax_registry_a_1: {amount: amount_4527230A, date: recorddate_4527225D, employer: name_4527232M}
    tax_registry_b_1: {amount: amount_4917619A, date: deductiondate_4917603D, employer: name_4917606M}
    tax_registry_c_1: {amount: pmtamount_36A, date: processingdate_168D, employer: employername_160M}

protected:                      # Section 4.4: excluded from the model, kept for slice analysis only
  # Every column C4's inventory flagged (results/c04/eda_summary.json) is
  # decided here; a test fails if a flagged column is in none of the lists.
  columns:
    - sex_738L                  # person_1, values F/M
    - gender_992L               # person_1, values F/M
    - birth_259D                # person_1, birth date (age)
    - birthdate_87D             # person_1, birth date (age)
    - birthdate_574D            # static_cb_0, bureau birth date (age)
    - dateofbirth_337D          # static_cb_0, birth date (age)
    - dateofbirth_342D          # static_cb_0, birth date (age)
    - familystate_447L          # person_1, family status
    - familystate_726L          # applprev_1, family status on a previous application
    - maritalst_703L            # person_1, marital status
    - maritalst_385M            # static_cb_0, marital status (masked)
    - maritalst_893M            # static_cb_0, marital status (masked)
  # Income type stays a feature (salaried, pensioner, self-employed carry real
  # repayment information) but its disability codes are recoded in the model
  # matrix only; the original column is kept for the slice analysis.
  disability_recode_column: incometype_1044T
  disability_income_values: [HANDICAPPED, HANDICAPPED_2, HANDICAPPED_3]
  disability_recode_value: OTHER
  # Geography is excluded from the model as a proxy for protected attributes
  # (the redlining risk in lending), decided in C6. Address-match flags and
  # address roles stay: they describe consistency, not location.
  proxy_columns:
    - district_544M               # applprev_1
    - previouscontdistrict_112M   # static_0
    - contaddr_district_15M       # person_1
    - contaddr_zipcode_807M       # person_1
    - empladdr_district_926M      # person_1
    - empladdr_zipcode_114M       # person_1
    - registaddr_district_1083M   # person_1
    - registaddr_zipcode_184M     # person_1
    - addres_district_368M        # person_2
    - addres_zip_823M             # person_2
  # Flagged by the inventory's word match but not a protected attribute.
  reviewed_not_protected:
    - equalitydataagreement_891L  # flags a change in socio-demographic data; matched "family" in its definition

model:                          # Sections 5.2 and 5.3
  target_approval_rate: 0.85    # tau is a policy choice, set on validation weeks
  calibration_method: isotonic  # isotonic | sigmoid
  optuna_trials: 50

explain:                        # Section 6
  max_reasons: 4                # Reg B commentary: more than four is unlikely to help
  shap_background_rows: 1000
  reference_population: approved_near_threshold   # all | approved_near_threshold

recourse:                       # Section 6.4
  bound_percentiles: [5, 95]
  max_groups_changed: 2

generate:                       # Section 6.3; provider and model are pinned in C19
  max_regenerations: 2
  temperature: 0.0

evaluation:                     # Section 7
  deterministic_explain_max: 5000
  prompt_dev_n: 50
  llm_eval_n: 300
  annotate_per_condition: 15
  bootstrap_resamples: 1000
  stability_seeds: 5
  perturbation_share: 0.01

llm:                            # Section 6.3; ported from Project 2 in C2
  default_temperature: 0.0
  # Relative paths resolve against the repo root; both live under the
  # gitignored .cache/ folder.
  quota_ledger_path: .cache/quota_ledger.json
  retry:
    max_attempts: 3
    initial_backoff_s: 2.0
    backoff_multiplier: 2.0
    retry_on_status: [500, 502, 503, 504]
    # A 429 is never retried on the same model for a day window; a minute
    # window is waited out up to this long before falling through.
    max_quota_wait_s: 90.0
    # When a role is pinned to one model there is nothing to switch to, so
    # minute-window waits are bounded per call by this total instead.
    max_pinned_wait_s: 600
  cache:
    # Keep enabled: a cached response is a recorded observation, so results
    # tables regenerate from the same outputs instead of re-rolling the model.
    enabled: true
    dir: .cache/llm

  # Model ids and limits are copied from Project 2's live-probed config
  # (Nov 2026). Both projects share the same API keys and therefore the same
  # provider quotas, but each keeps its own ledger. On a day both run, expect
  # more 429-driven switching than either ledger predicts.
  roles:
    # Writes the adverse-action letters under test (E0-E3). The chain is for
    # development; C19 pins one model so all four conditions use the same one.
    generation:
      - provider: groq
        model: openai/gpt-oss-120b
        max_output_tokens: 2048
        reasoning_effort: medium
        supports_json_mode: true
        limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, reset_timezone: UTC}
      - provider: groq
        model: qwen/qwen3.8-27b
        max_output_tokens: 2048
        reasoning_effort: medium
        supports_json_mode: true
        limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, reset_timezone: UTC}

    # Turns free-text letters (E0, E1) into claim JSON for the verifier.
    # Mechanical, so a smaller model leads.
    extraction:
      - provider: groq
        model: openai/gpt-oss-20b
        max_output_tokens: 1024
        reasoning_effort: low
        supports_json_mode: true
        limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, reset_timezone: UTC}
      - provider: gemini
        model: gemma-4-31b-it
        max_output_tokens: 2048
        supports_json_mode: false          # Gemma: no JSON mode; local repair handles it
        supports_system_instruction: false # Gemma: no system role; folded into the prompt
        limits: {rpm: 30, rpd: 14400, tpm: 16000, reset_timezone: America/Los_Angeles}

    # The Explingo-style LLM grader that claim 1b compares with the verifier.
    # A different provider and family from generation, enforced on load, so
    # no model grades its own letters. Single model: a grader that changes
    # model mid-run makes its scores incomparable.
    grader:
      - provider: gemini
        model: gemini-3.1-flash-lite
        max_output_tokens: 1024
        thinking_budget: 0
        supports_json_mode: true
        limits: {rpm: 15, rpd: 500, tpm: 250000, reset_timezone: America/Los_Angeles}

  # Pin a role to one model for evaluation runs (set in C19). null = use the chain.
  pin:
    generation: null
    extraction: null
    grader: null
