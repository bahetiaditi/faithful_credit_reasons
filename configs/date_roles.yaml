# How each date column is treated before aggregation (REFERENCE.md 5.1 step 3).
# Decided in C5 from column names and the ranges C4 measured
# (results/c04/date_checks.csv); a test checks every column named here exists
# as a date column in results/c04/schema_registry.json.
#
# Rules
#   - Every date becomes "days before the case's date_decision" (negative =
#     after the decision).
#   - Event dates (the default) record something that already happened. A value
#     after the case's own date_decision is information from the future: it is
#     set to null.
#   - Scheduled dates are planned dates (contract end, maturity, first due
#     date). They may legitimately lie after the decision and are kept.
#   - Anchors: for a multi-row table, the date the record came into being. A
#     record whose anchor is after date_decision did not exist yet: the whole
#     row is dropped. Several anchor columns are coalesced in order.
#   - Retrieval timestamps record when the lender pulled data from a provider
#     while processing the application, typically days after date_decision.
#     They are not events in the applicant's history: they are dropped (never
#     features, never anchors). Added in C5.1 after the first real build nulled
#     almost every response date and an anchor on one of them dropped half the
#     tax registry. Their ids follow the provider relay seen in the tax
#     registries (1012 / 4527 / 4917).
#   - Sentinels: dates before `before` or on/after `after` are placeholders,
#     not dates (C4 saw 1900-01-01, 1900-01-15, 2098-01-15). Set to null first.

sentinels:
  before: "1901-01-01"
  after: "2090-01-01"

scheduled:
  - dateofcredend_289D          # credit_bureau_a_1: planned contract end (to 2098)
  - dateofcredend_353D          # credit_bureau_a_1: planned contract end
  - contractmaturitydate_151D   # credit_bureau_b_1: maturity (to 2045)
  - contractenddate_991D        # deposit_1: deposit contract end
  - firstdatedue_489D           # static_0: first instalment due date of the loan
  - firstnonzeroinstldate_307D  # applprev_1: first scheduled non-zero instalment

retrieval:
  - responsedate_1012D          # static_cb_0: bureau response, provider 1 (C5: 718k of 720k after decision)
  - responsedate_4527233D       # static_cb_0: bureau response, provider 2 (660k of 660k after)
  - responsedate_4917613D       # static_cb_0: bureau response, provider 3 (224k of 225k after)
  - assignmentdate_4527235D     # static_cb_0: provider 2 assignment (115k of 115k after)
  - refreshdate_3813885D        # credit_bureau_a_1: bureau data refresh (5.7M of 11.1M after)
  - recorddate_4527225D         # tax_registry_a_1: earliest value is provider 2's first day, so not a deduction history

anchors:
  applprev_1: [creationdate_885D]                            # never null in C4
  credit_bureau_a_1: [dateofcredstart_181D, dateofcredstart_739D]  # two complementary column sets
  credit_bureau_b_1: [contractdate_551D]
  credit_bureau_b_2: [pmts_date_1107D]                       # one payment-history row
  debitcard_1: [openingdate_857D]
  deposit_1: [openingdate_313D]
  # tax_registry_a_1 has no anchor: its only date is a retrieval timestamp (above).
  tax_registry_b_1: [deductiondate_4917603D]
  tax_registry_c_1: [processingdate_168D]

# Dates stored as separate year and month columns (T suffix). C5.2 composes each
# pair into one date at the end of that month, which then follows the event-date
# rules like any other (nulled if after the decision, else days before it).
# Before C5.2 they were raw calendar years and months: a year encodes the
# calendar (2018 is two years ago in 2020, one in 2019), a month alone carries
# no meaning, and pmts_year_1139T reached 2021, after every decision.
# Pairs were matched by name within each column set and confirmed by identical
# case-level missingness on the C7 sample; the build re-checks it row by row.
year_month_pairs:
  credit_bureau_a_1:
    - [dpdmaxdateyear_596T, dpdmaxdatemonth_89T]
    - [dpdmaxdateyear_896T, dpdmaxdatemonth_442T]
    - [overdueamountmaxdateyear_2T, overdueamountmaxdatemonth_365T]
    - [overdueamountmaxdateyear_994T, overdueamountmaxdatemonth_284T]
  credit_bureau_a_2:
    - [pmts_year_1139T, pmts_month_158T]
    - [pmts_year_507T, pmts_month_706T]
  credit_bureau_b_1:
    - [dpdmaxdateyear_742T, dpdmaxdatemonth_804T]
    - [overdueamountmaxdateyear_432T, overdueamountmaxdatemonth_494T]

# Anchor-drop shares reviewed on the real data. The C5 smoke warns only when a
# family drops more than max(20%, expected + 5 points).
anchor_drop_expected:
  # C5.1: 21.7% of registry c rows are processed after the decision. Its last
  # month of deductions is recorded up to ~30 days later (lag profile), so the
  # drop removes the post-decision month, which is what it should do.
  tax_registry_c_1: 0.22
