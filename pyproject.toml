[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcr"
version = "0.1.0"
description = "Faithful credit reasons: an out-of-time credit default model plus a verified LLM reason-writing layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aditi Baheti" }]
# Local development runs on 3.12. The floor is 3.11 because the Kaggle image's
# Python version is outside our control; smoke_c01 prints it so we know.
requires-python = ">=3.11"

# Lower bounds only, on purpose. On Kaggle most of these are preinstalled, and
# exact pins here would make pip replace Kaggle's numpy/scipy stack. Exact,
# reproducible versions for local work live in requirements.txt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    "optbinning>=0.19",
    "shap>=0.44",
    "optuna>=3.5",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "textstat>=0.7",
    "matplotlib>=3.8",
    "google-genai>=1.0",
    "groq>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/bahetiaditi/faithful_credit_reasons"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
